<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- Lets CSS hide hero copy for its entrance only when JS will run it.
         Allowed by its sha256 hash in the CSP (vercel.json): edit both together. -->
    <script>document.documentElement.classList.add('js')</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111731" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonts: the same self-hosted Inter + Bricolage Grotesque as the rest of
         www.antonyaddy.com (no Google Fonts request, so nothing leaves the site). -->
    <link rel="preload" href="/ia/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/ia/fonts/bricolage-grotesque-latin-opsz-wght.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/ia/fonts/inter-latin-wght.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 600 800; font-display: swap; src: url(/ia/fonts/bricolage-grotesque-latin-opsz-wght.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    </style>

    <!-- Brand icons are the main site's (same origin), so every page shares one logo. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/ia/manifest.json">

    <!-- No static title/meta-description/og/twitter tags here on purpose: SEOHead.tsx
         (react-helmet-async) injects those per-route, both client-side on hydration
         and server-side via prerender.js. -->
    <!--app-head-->
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
